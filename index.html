<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bills</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Nunito:wght@700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div>
        <h1><span class="bill-icon" aria-hidden="true">🧾</span> Bills</h1>
      </div>
      <button id="resetBtn" class="ghost-btn" type="button">Xóa dữ liệu</button>
    </header>

    <section class="workspace" aria-label="Khu vực tính tiền">
      <div id="peopleGrid" class="people-grid" aria-label="Các khoản đã chi"></div>

      <div class="result-column">
        <aside class="result-panel" aria-label="Kết quả thanh toán">
          <button
            id="resultTitleBtn"
            class="result-title-btn"
            type="button"
            aria-expanded="false"
          >
            <span>TỔNG</span>
            <span class="result-title-caret">⌄</span>
          </button>

          <div class="matrix-wrap">
            <table id="resultMatrix" class="result-matrix">
              <thead></thead>
              <tbody></tbody>
            </table>
          </div>

          <div id="detailPanel" class="detail-panel is-hidden"></div>
        </aside>

        <section class="note-panel" aria-label="Ghi chú tự do">
          <div class="note-panel-head">
            <h2 class="note-panel-title">Ghi chú</h2>
          </div>
          <textarea
            id="notePad"
            class="note-panel-input"
            rows="4"
            placeholder="Ghi chú tự do..."
          ></textarea>
        </section>
      </div>
    </section>
  </main>

  <!-- Template: cột của từng người -->
  <template id="personTemplate">
    <article class="person-panel">
      <div class="person-head">
        <h2 class="person-title"></h2>
      </div>
      <div class="active-groups"></div>
    </article>
  </template>

  <!-- Template: từng nhóm chi tiêu -->
  <template id="groupTemplate">
    <section class="expense-group">
      <div class="group-topline">
        <div class="group-heading">
          <h3 class="group-title"></h3>
          <button
            class="group-add-btn"
            type="button"
            title="Thêm khoản"
            aria-label="Thêm khoản"
          >＋</button>
        </div>

        <div class="group-summary" aria-label="Tổng hợp nhóm">
          <div class="summary-row">
            <span class="summary-label">Tổng</span>
            <strong class="summary-value summary-total">—</strong>
          </div>
          <div class="summary-row">
            <span class="summary-label summary-share-label">Mỗi người</span>
            <strong class="summary-value summary-share">—</strong>
          </div>
        </div>
      </div>

      <div class="expense-rows"></div>
    </section>
  </template>

  <script src="script.js"></script>
</body>
</html>
